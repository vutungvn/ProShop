# ============================================================
# nginx.conf
# Đặt file này tại: frontend/nginx.conf
# ============================================================

server {
    listen 80;
    server_name proshop-team-master-devops.duckdns.org;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # Mọi request vào /api/ hoặc /uploads/ → forward sang backend container
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass         http://backend:5000;
        proxy_set_header   Host $host;
    }

    # React Router: mọi route không tìm thấy file → trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================
# docker-compose.yml
# Đặt file này tại: thư mục GỐC của project (cùng cấp với /backend, /frontend)
# ============================================================

version: "3.9"

services:
  # ─── 1. DATABASE ────────────────────────────────────────────
  mongo:
    image: mongo:5.0 # MongoDB 5.x khớp với mongoose ^5.10.6 trong package.json
    container_name: proshop-mongo
    restart: unless-stopped # Tự động restart nếu container bị lỗi
    environment:
      MONGO_INITDB_DATABASE: proshop
    volumes:
      - mongo_data:/data/db # Dữ liệu được persist, không mất khi restart
    networks:
      - proshop-net
    # ⚠️  KHÔNG expose port 27017 ra host machine (bảo mật)
    #     Chỉ các container trong cùng network mới kết nối được
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "0.5" # Giới hạn CPU tối đa 50%
          memory: 512M # Giới hạn RAM tối đa 512MB

  # ─── 2. BACKEND ─────────────────────────────────────────────
  backend:
    build:
      context: . # ← ROOT, nơi có package.json
      dockerfile: backend/Dockerfile
    container_name: proshop-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy # Đợi mongo sẵn sàng (healthcheck)
    env_file:
      - .env
    volumes:
      # Mount thư mục uploads ra ngoài để file upload không mất khi rebuild
      - uploads_data:/app/uploads
    networks:
      - proshop-net
    # ⚠️  KHÔNG expose port 5000 ra ngoài (frontend nginx sẽ proxy nội bộ)
    # ports:
    #   - "5000:5000"        # Bỏ comment dòng này chỉ khi cần debug trực tiếp

    deploy:
      resources:
        limits:
          cpus: "0.5" # Giới hạn CPU tối đa 50%
          memory: 256M # Giới hạn RAM tối đa 256MB

  # ─── 3. FRONTEND ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend # Docker build từ thư mục frontend/
      dockerfile: Dockerfile
    container_name: proshop-frontend
    restart: unless-stopped
    depends_on:
      - backend # Đợi backend sẵn sàng trước
    ports:
      - "80:80" # Expose ra ngoài: truy cập http://localhost hoặc http://proshop-team-master-devops.duckdns.org
    networks:
      - proshop-net

    deploy:
      resources:
        limits:
          cpus: "0.3" # Giới hạn CPU tối đa 30%
          memory: 128M # Giới hạn RAM tối đa 128MB

# ─── VOLUMES ──────────────────────────────────────────────────
volumes:
  mongo_data: # Persist dữ liệu MongoDB
    driver: local
  uploads_data: # Persist file upload của backend
    driver: local

# ─── NETWORK ──────────────────────────────────────────────────
networks:
  proshop-net:
    driver: bridge # Mạng nội bộ, các service giao tiếp bằng tên service
